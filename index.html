<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Hunt 2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="treasure-widget" id="treasure-widget">
            <div class="treasure-label">Current Treasure Value</div>
            <div id="treasure-value" class="treasure-value">Loading...</div>
        </div>

        <h1 class="landing-title">The Milo Holiday Hunt <span id="secret-o">2027</span></h1>
        
        <div id="wait-mode">
            <p class="subtitle">The hunt begins in...</p>
            <div id="timer">
                <div class="time-unit">
                    <div class="number" id="days">00</div>
                    <div class="label">Days</div>
                </div>
                <div class="time-unit">
                    <div class="number" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="time-unit">
                    <div class="number" id="minutes">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-unit">
                    <div class="number" id="seconds">00</div>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>

        <div id="reveal-content" style="display: none;">
            <p class="subtitle">The wait is over. Good luck!</p>
            <div id="button-container">
                </div>
        </div>
    </div>

    <script src="snow.js"></script>
    <script src="utils.js"></script>
    <script>
        // Set target date to Jan 1, 2027 at 9:00 AM Pacific Time (UTC-8)
        const targetDate = new Date('2027-01-01T09:00:00-08:00').getTime(); 
        const treasureAddress = 'bc1qdluefrhrzu3px5p3x6qfgdcuw6qlyymwsk8kjy';

        // Decoded: "1-capital.html"
        const _0x4f2a = [49, 45, 99, 97, 112, 105, 116, 97, 108, 46, 104, 116, 109, 108];

        async function checkTreasureStatus() {
            const displayEl = document.getElementById('treasure-value');
            const widgetEl = document.getElementById('treasure-widget');
            
            try {
                // Fetch balance from Mempool.space
                const addressRes = await fetch(`https://mempool.space/api/address/${treasureAddress}`);
                if (!addressRes.ok) throw new Error("Balance API error");
                const addressData = await addressRes.json();
                
                // Calculate balance from chain_stats
                const funded = addressData.chain_stats.funded_txo_sum || 0;
                const spent = addressData.chain_stats.spent_txo_sum || 0;
                const totalSats = funded - spent;
                
                // Fetch price independently
                let usdValueStr = "";
                try {
                    const priceRes = await fetch('https://mempool.space/api/v1/prices');
                    if (priceRes.ok) {
                        const priceData = await priceRes.json();
                        const btcPrice = priceData.USD || 0;
                        const usdValue = (totalSats / 100000000) * btcPrice;
                        if (usdValue > 0) {
                            usdValueStr = `<br><span style="font-size: 0.8em; opacity: 0.8;">$${usdValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>`;
                        }
                    }
                } catch (e) { 
                    console.warn("Price fetch failed, continuing with balance only."); 
                }

                if (totalSats > 0) {
                    const btcAmount = totalSats / 100000000;
                    displayEl.innerHTML = `
                        ${totalSats.toLocaleString()} satoshis<br>
                        <span style="font-size: 0.8em; opacity: 0.8;">${btcAmount.toFixed(8)} Bitcoin</span>${usdValueStr}
                    `;
                } else if (funded > 0) {
                    // It was funded and then spent, so it was claimed
                    displayEl.innerText = "CLAIMED";
                    displayEl.classList.add('treasure-claimed');
                    widgetEl.style.borderColor = "rgba(255, 107, 107, 0.4)";
                } else {
                    // Never funded or just 0
                    displayEl.innerText = "0 satoshis";
                }
            } catch (error) {
                console.error("Treasure status error:", error);
                displayEl.innerText = "Status Unavailable";
            }
        }
        
        checkTreasureStatus();

        function revealHunt() {
            if (typeof timerInterval !== 'undefined') clearInterval(timerInterval);
            
            const waitMode = document.getElementById("wait-mode");
            const revealContent = document.getElementById("reveal-content");
            
            if (waitMode) waitMode.style.display = "none";
            if (revealContent) revealContent.style.display = "block";
            
            const container = document.getElementById("button-container");
            if (container && container.innerHTML === "") {
                const btn = document.createElement("a");
                btn.className = "btn-style"; 
                btn.innerText = "Begin The Hunt";
                btn.href = _decode(_0x4f2a); 
                container.appendChild(btn);
            }
        }

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                revealHunt();
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const dEl = document.getElementById("days");
            const hEl = document.getElementById("hours");
            const mEl = document.getElementById("minutes");
            const sEl = document.getElementById("seconds");

            if (dEl) dEl.innerText = days < 10 ? "0" + days : days;
            if (hEl) hEl.innerText = hours < 10 ? "0" + hours : hours;
            if (mEl) mEl.innerText = minutes < 10 ? "0" + minutes : minutes;
            if (sEl) sEl.innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);

        const secretO = document.getElementById("secret-o");
        if (secretO) secretO.addEventListener("click", revealHunt);
    </script>
</body>
</html>
