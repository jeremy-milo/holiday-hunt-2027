<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>7. call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 7: The Nose Knows</h1>
            <p class="instructions">Tap the yeti to help him sing if you need a hint.</p>
           
            <div id="game-container" class="game-frame">
                <!-- Note: Ensure 'yeti-black.jpg' and 'yeti-red.jpg' exist in your directory -->
                <img src="yeti-black.jpg" id="puzzle-image" alt="Yeti Puzzle">
                <div id="input-area">
                    <input type="text" id="yeti-msg" class="answer-input answer-input-custom" placeholder="What is the yeti's favorite song?">
                </div>
                <button class="btn-style" onclick="checkAnswers()">Verify Message</button>

                <div id="ui-layer" class="ui-layer hidden-ui">
                    <div id="win-screen">
                        <div class="game-msg">Message Received!</div>
                        <button class="btn-style" id="next-level-btn" onclick="nextLevel()">Next puzzle</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="spacer-medium"></div>
        <div class="hidden-clue">7. call</div>
    </div>

    <script src="snow.js"></script>
    <script src="utils.js"></script>
    <script>
        // ASCII Obfuscation Decoder
        const _d = (arr) => String.fromCharCode(...arr);

        const uiLayer = document.getElementById('ui-layer');
        const puzzleImage = document.getElementById('puzzle-image');
        const imgOff = "yeti-black.jpg"; 
        const imgOn = "yeti-red.jpg";
        const preloadImg = new Image(); 
        preloadImg.src = imgOn;

        // Slowed down by 30% (300 * 1.3 = 390)
        const UNIT = 390; 
        const DOT = UNIT; 
        const DASH = UNIT * 3;
        const SYMBOL_SPACE = UNIT; 
        const LETTER_SPACE = UNIT * 3;
        const WORD_SPACE = UNIT * 7; 
        const LOOP_DELAY = 3000;
        
        const morseMap = { 'J': '.---', 'I': '..', 'N': '-.', 'G': '--.', 'L': '.-..', 'E': '.', 'B': '-...', 'S': '...', ' ': ' ' };
        
        // Obfuscated Message: "JINGLE BELLS"
        const _m = [74, 73, 78, 71, 76, 69, 32, 66, 69, 76, 76, 83];
        const message = _d(_m); 
        let isAnimating = true;

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function playMorseLoop() {
            while (isAnimating) {
                await wait(1000);
                for (let i = 0; i < message.length; i++) {
                    const char = message[i];
                    if (char === ' ') { await wait(WORD_SPACE); continue; }
                    const code = morseMap[char]; 
                    if (!code) continue;
                    for (let j = 0; j < code.length; j++) {
                        const symbol = code[j]; 
                        const duration = symbol === '.' ? DOT : DASH;
                        playTone(duration);
                        puzzleImage.src = imgOn; 
                        await wait(duration);
                        puzzleImage.src = imgOff;
                        if (j < code.length - 1) { await wait(SYMBOL_SPACE); }
                    }
                    await wait(LETTER_SPACE);
                }
                await wait(LOOP_DELAY);
            }
        }
        
        let soundEnabled = false;
        
        const enableAudio = () => { 
            soundEnabled = true; 
            if (audioCtx.state === 'suspended') { audioCtx.resume(); } 
        };
        
        puzzleImage.addEventListener('click', enableAudio);
        puzzleImage.addEventListener('touchstart', enableAudio, {passive: true});

        function playTone(duration) {
            if (!soundEnabled) return; 
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            
            const osc = audioCtx.createOscillator(); 
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode); 
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            
            const now = audioCtx.currentTime; 
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05);
            gainNode.gain.setValueAtTime(0.1, now + (duration/1000) - 0.05);
            gainNode.gain.linearRampToValueAtTime(0, now + (duration/1000));
            
            osc.start(now); 
            osc.stop(now + (duration/1000) + 0.1);
        }

        playMorseLoop();
        
        // Obfuscated Answer Key: "jingle bells"
        const _k = [106, 105, 110, 103, 108, 101, 32, 98, 101, 108, 108, 115];
        
        function checkAnswers() {
            const inputEl = document.getElementById('yeti-msg'); 
            const val = inputEl.value.toLowerCase().trim(); 
            const correct = _d(_k);
            if (val === correct) { 
                playSound('win'); 
                uiLayer.classList.remove('hidden-ui'); 
                uiLayer.classList.add('active-ui'); 
            } else { 
                playSound('slide'); 
                inputEl.classList.remove('shake'); 
                void inputEl.offsetWidth; 
                inputEl.classList.add('shake'); 
            }
        }
        
        const _next = [56, 45, 114, 111, 97, 115, 116, 46, 104, 116, 109, 108];
        function nextLevel() {
            goToNextLevel(_next);
        }
    </script>
</body>
</html>
