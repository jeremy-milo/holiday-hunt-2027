<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>7. call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
</head>
<body>
    <canvas id="snow-canvas"></canvas>

    <div class="container">
        <!-- Using generic classes from puzzle-style.css where possible -->
        <div class="puzzle-box">
            <h1>Puzzle Seven: The Nose Knows</h1>
            <p class="instructions">Give the yeti a high five if you need a hint.</p>

            <div id="game-container-morse">
                <!-- Yeti Image -->
                <img src="yeti-black.jpg" id="puzzle-image" alt="Yeti Puzzle">

                <!-- Input Slots -->
                <div id="input-area">
                    <input type="text" id="yeti-msg" class="answer-input answer-input-custom" placeholder="What is the yeti's favorite song?">
                </div>

                <!-- Submit Button -->
                <button class="btn-style" onclick="checkAnswers()">Verify Message</button>

                <!-- Win Screen -->
                <div id="ui-layer" class="ui-layer hidden-ui">
                    <div id="win-screen">
                        <div class="game-msg">Message Received!</div>
                        <button class="btn-style" id="next-level-btn" onclick="nextLevel()">Proceed to Next Puzzle</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- The Long Space -->
        <div class="spacer-large"></div>

        <!-- The Hidden Clue -->
        <div class="hidden-clue">7. call</div>
    </div>

    <!-- UTILS and SNOW scripts -->
    <script src="utils.js"></script>
    <script src="snow.js"></script>

    <script>
        const uiLayer = document.getElementById('ui-layer');
        const puzzleImage = document.getElementById('puzzle-image');
        
        // --- MORSE CODE LOGIC ---
        const imgOff = "yeti-black.jpg";
        const imgOn = "yeti-red.jpg";

        // Preload active image
        const preloadImg = new Image();
        preloadImg.src = imgOn;

        // Timing Constants (in ms)
        const UNIT = 300; 
        const DOT = UNIT;
        const DASH = UNIT * 3;
        const SYMBOL_SPACE = UNIT;      // Space between dots/dashes
        const LETTER_SPACE = UNIT * 4;  // Space between letters (increased by 30% from 3)
        const WORD_SPACE = UNIT * 10;    // Space between words
        const LOOP_DELAY = 3000;        // 3 seconds pause at end

        // Morse Dictionary
        const morseMap = {
            74: '.---',
            73: '..',
            78: '-.',
            71: '--.',
            76: '.-..',
            69: '.',
            66: '-...',
            83: '...',
            32: ' '
        };

        const _m = [74, 73, 78, 71, 76, 69, 32, 66, 69, 76, 76, 83];
        
        let isAnimating = true;
        let soundEnabled = false;

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function playMorseLoop() {
            while (isAnimating) {
                // Initial pause before starting
                await wait(1000);

                for (let i = 0; i < _m.length; i++) {
                    const charCode = _m[i];
                    
                    if (charCode === 32) {
                        await wait(WORD_SPACE);
                        continue;
                    }

                    const code = morseMap[charCode];
                    if (!code) continue;

                    // Play each symbol in the letter
                    for (let j = 0; j < code.length; j++) {
                        const symbol = code[j];
                        const duration = symbol === '.' ? DOT : DASH;
                        
                        // Play Tone (Custom envelope for morse)
                        playTone(duration);

                        // Visual ON
                        puzzleImage.src = imgOn;
                        await wait(duration);
                        
                        // Visual OFF
                        puzzleImage.src = imgOff;
                        
                        // Wait between symbols (intra-character), unless it's the last symbol
                        if (j < code.length - 1) {
                            await wait(SYMBOL_SPACE);
                        }
                    }
                    
                    // Wait between letters (inter-character)
                    await wait(LETTER_SPACE);
                }

                // Wait 3 seconds before looping
                await wait(LOOP_DELAY);
            }
        }

        // Enable sound on Yeti interaction
        function enableSound() {
            soundEnabled = true;
            // audioCtx is global from utils.js
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        puzzleImage.addEventListener('click', enableSound);
        puzzleImage.addEventListener('touchstart', enableSound, {passive: true});

        // Custom Tone function using shared audioCtx but specific Morse envelope
        function playTone(duration) {
            // Check if sound has been enabled by user interaction
            if (!soundEnabled) return;
            
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); // 600Hz tone
            
            // Envelope to avoid clicking sounds
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05);
            gainNode.gain.setValueAtTime(0.1, now + (duration/1000) - 0.05);
            gainNode.gain.linearRampToValueAtTime(0, now + (duration/1000));

            osc.start(now);
            osc.stop(now + (duration/1000) + 0.1);
        }

        // Start the Morse Loop
        playMorseLoop();

        // --- PUZZLE VALIDATION ---
        
        const _k = [106, 105, 110, 103, 108, 101, 32, 98, 101, 108, 108, 115];

        function checkAnswers() {
            const inputEl = document.getElementById('yeti-msg');
            const val = inputEl.value.toLowerCase().trim();
            // _decode is from utils.js
            const correct = _decode(_k);
            
            if (val === correct) {
                // playSound is from utils.js
                playSound('win');
                uiLayer.classList.remove('hidden-ui');
                uiLayer.classList.add('active-ui');
            } else {
                // playSound('slide') acts as our error/try-again sound in utils
                playSound('slide'); 
                inputEl.classList.remove('shake');
                void inputEl.offsetWidth; // trigger reflow
                inputEl.classList.add('shake');
            }
        }

        // Next Level Navigation
        const _next = [56, 45, 114, 111, 97, 115, 116, 46, 104, 116, 109, 108];
        function nextLevel() {
            // goToNextLevel is from utils.js
            goToNextLevel(_next);
        }
    </script>
</body>
</html>
