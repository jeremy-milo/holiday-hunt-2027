<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>8. roast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 8: Play that Song</h1>
            <p class="instructions">The yeti has a song request for you.</p>
           
            <div id="game-container" class="game-frame" style="background: none; border: none; box-shadow: none;">
                <div class="piano-wrapper">
                    <div class="keys-container" id="piano-keys"></div>
                </div>
            </div>

            <div id="ui-layer" class="ui-layer hidden-ui">
                <div id="win-screen">
                    <div class="game-msg">Bravo!</div>
                    <button class="btn-style" id="next-level-btn" onclick="nextLevel()">Next puzzle</button>
                </div>
            </div>
        </div>

        <div class="spacer-medium"></div>
        <div class="hidden-clue">8. roast</div>
    </div>

    <script src="snow.js"></script>
    <script src="utils.js"></script>
    <script>
        const pianoContainer = document.getElementById('piano-keys');
        
        // Use audioCtx from utils.js if available, or create one
        // Note: utils.js already creates one called audioCtx
        
        function buildPiano() {
            pianoContainer.innerHTML = ''; 
            let globalIdx = 0; 
            const minKey = 4; 
            const maxKey = 33; 
            for (let oct = 0; oct < 3; oct++) {
                const patterns = [{ w: 'C', b: 'C#' }, { w: 'D', b: 'D#' }, { w: 'E', b: null }, { w: 'F', b: 'F#' }, { w: 'G', b: 'G#' }, { w: 'A', b: 'A#' }, { w: 'B', b: null }];
                for (let i = 0; i < patterns.length; i++) {
                    const p = patterns[i];
                    if (globalIdx >= minKey && globalIdx < maxKey) {
                        const wKey = document.createElement('div'); 
                        wKey.className = 'white-key'; 
                        wKey.dataset.note = globalIdx;
                        wKey.style.touchAction = 'none'; // Prevent scrolling while playing
                        
                        const currentIdx = globalIdx; 
                        
                        // Unified pointer handling for mobile and desktop
                        wKey.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            playNote(currentIdx, wKey);
                        });
                        
                        pianoContainer.appendChild(wKey);
                        if (p.b && globalIdx + 1 < maxKey) {
                             const bKey = document.createElement('div'); 
                             bKey.className = 'black-key'; 
                             bKey.dataset.note = globalIdx + 1;
                             bKey.style.touchAction = 'none';
                             
                             const bIdx = globalIdx + 1; 
                             bKey.addEventListener('pointerdown', (e) => {
                                 e.stopPropagation();
                                 e.preventDefault();
                                 playNote(bIdx, bKey);
                             });
                             wKey.appendChild(bKey);
                        }
                    }
                    if (p.b) globalIdx += 2; else globalIdx += 1;
                    if (globalIdx > maxKey + 10) break; 
                }
            }
            showHint();
        }
        
        function showHint() { 
            const hintKey = document.querySelector('.white-key[data-note="16"]'); 
            if (hintKey) hintKey.classList.add('key-hint'); 
        }
        
        function removeHints() { 
            const hints = document.querySelectorAll('.key-hint'); 
            hints.forEach(k => k.classList.remove('key-hint')); 
        }
        
        buildPiano();

        const baseSeq = [ 4,4,4, 4,4,4, 4,7,0,2,4 ];
        
        function playNote(index, element) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator(); 
            const gain = audioCtx.createGain();
            const freq = 130.81 * Math.pow(2, index / 12);
            
            osc.frequency.value = freq; 
            osc.type = 'triangle'; 
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime; 
            gain.gain.setValueAtTime(0, now); 
            gain.gain.linearRampToValueAtTime(0.3, now + 0.05); 
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            
            osc.start(now); 
            osc.stop(now + 0.6);
            
            element.classList.add('active'); 
            setTimeout(() => element.classList.remove('active'), 150);
            checkSequence(index);
        }

        let matchIndex = 0; 
        let detectedOctaveOffset = -1;
        
        function checkSequence(noteIndex) {
            let targetRel = baseSeq[matchIndex];
            if (matchIndex === 0) {
                const relative = noteIndex % 12;
                if (relative === 4) { 
                    removeHints(); 
                    matchIndex = 1; 
                    detectedOctaveOffset = noteIndex - 4; 
                    return; 
                }
            } else {
                const expected = targetRel + detectedOctaveOffset;
                if (noteIndex === expected) { 
                    matchIndex++; 
                    if (matchIndex >= baseSeq.length) { 
                        winGame(); 
                    } 
                } else {
                    const relative = noteIndex % 12;
                    if (relative === 4) { 
                        matchIndex = 1; 
                        detectedOctaveOffset = noteIndex - 4; 
                    } else { 
                        matchIndex = 0; 
                        detectedOctaveOffset = -1; 
                    }
                }
            }
        }
        
        function winGame() { 
            playSound('win');
            const ui = document.getElementById('ui-layer'); 
            ui.classList.remove('hidden-ui');
            ui.classList.add('active-ui'); 
        }
        
        const _dest = [57, 45, 99, 97, 110, 99, 101, 108, 46, 104, 116, 109, 108];
        function nextLevel() {
            goToNextLevel(_dest);
        }
    </script>
</body>
</html>
