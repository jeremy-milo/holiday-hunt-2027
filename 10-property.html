<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>10. property</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
    
    <style>
        .comparison-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden; /* Prevent overflow if image gets huge */
        }

        .img-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        img {
            max-width: none; /* Allow manual resizing beyond container constraint if needed logic-wise, but kept reasonable */
            height: auto;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: width 0.1s linear; /* Smooth resizing */
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 30px;
            margin-top: 10px;
        }

        input[type="range"] {
            width: 200px;
            cursor: pointer;
        }

        .adjust-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .adjust-btn:hover { background: rgba(255,255,255,0.2); }

        .size-display {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        #target-img {
            /* This is the reference image - fixed size via CSS or intrinsic */
            width: 300px; /* Reference width */
        }

        #adjustable-img {
            /* Initial width */
            width: 150px; 
        }

        .label {
            color: #f6d365;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 10: Size Matters</h1>
            <p class="instructions">Resize the Key to match the Code exactly. When the dimensions align, the path forward will open.</p>
            
            <div class="comparison-area">
                <div style="text-align:center;">
                    <div class="label">The Code</div>
                    <div class="img-container">
                        <img src="code.png" id="target-img" alt="Code Pattern">
                    </div>
                </div>

                <div style="border-top: 1px dashed rgba(255,255,255,0.2); width: 100%; margin: 10px 0;"></div>

                <div style="text-align:center;">
                    <div class="label">The Key</div>
                    <div class="img-container">
                        <img src="key.png" id="adjustable-img" alt="Key Pattern">
                    </div>
                    
                    <div class="controls">
                        <button class="adjust-btn" onclick="adjustSize(-1)">-</button>
                        <!-- FIX: Step set to 1 for precise pixel matching -->
                        <input type="range" id="size-slider" min="50" max="500" value="150" step="1" oninput="updateFromSlider(this.value)">
                        <button class="adjust-btn" onclick="adjustSize(1)">+</button>
                    </div>
                    <div class="size-display" id="size-val">Width: 150px</div>
                </div>
            </div>

            <button class="btn-style" onclick="checkMatch()">Check Alignment</button>
            <p id="feedback" style="height: 20px; color: #ffeb3b; font-weight: bold; margin-top: 10px;"></p>

            <div id="ui-layer" class="ui-layer hidden-ui">
                <div id="win-screen">
                    <div class="game-msg">A perfect fit!</div>
                    <!-- Updated to use shared utils -->
                    <button class="btn-style" id="next-level-btn" onclick="goToNextLevel(_next)">Next puzzle</button>
                </div>
            </div>
        </div>

        <div class="spacer-large"></div>
        <div class="hidden-clue">10. property</div>
    </div>

    <!-- SHARED SCRIPTS -->
    <script src="utils.js"></script>
    <script src="snow.js"></script>

    <script>
        const targetImg = document.getElementById('target-img');
        const adjImg = document.getElementById('adjustable-img');
        const slider = document.getElementById('size-slider');
        const display = document.getElementById('size-val');
        const feedback = document.getElementById('feedback');
        
        // Target width defined in CSS as 300px
        const TARGET_WIDTH = 300; 

        function updateFromSlider(val) {
            adjImg.style.width = val + 'px';
            display.innerText = `Width: ${val}px`;
            feedback.innerText = "";
        }

        function adjustSize(delta) {
            let current = parseInt(slider.value);
            let newVal = current + delta;
            
            // Clamp value
            if (newVal < parseInt(slider.min)) newVal = parseInt(slider.min);
            if (newVal > parseInt(slider.max)) newVal = parseInt(slider.max);
            
            slider.value = newVal;
            updateFromSlider(newVal);
        }

        function checkMatch() {
            // Get current width
            // We use the slider value because style.width might return "300px" string
            const currentWidth = parseInt(slider.value);

            // Allow 0 tolerance because steps are now 1px
            if (currentWidth === TARGET_WIDTH) {
                if (typeof playSound === 'function') playSound('win');
                document.getElementById('ui-layer').classList.remove('hidden-ui');
                document.getElementById('ui-layer').classList.add('active-ui');
            } else {
                if (typeof playSound === 'function') playSound('slide'); // error sound or click
                
                const diff = Math.abs(currentWidth - TARGET_WIDTH);
                if (diff < 10) {
                    feedback.innerText = "So close! Just a tiny bit off.";
                } else if (diff < 30) {
                    feedback.innerText = "Getting warmer...";
                } else {
                    feedback.innerText = "Not quite aligned yet.";
                }
            }
        }

        // ASCII for 11-case.html
        const _next = [49, 49, 45, 99, 97, 115, 101, 46, 104, 116, 109, 108];

        // Ensure we start consistent
        updateFromSlider(150);
    </script>
</body>
</html>
