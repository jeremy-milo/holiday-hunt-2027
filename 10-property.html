<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>10. property</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
    <style>
        /* --- IMAGE MANIPULATION STYLES --- */
        #img-manipulation-area {
            position: relative;
            width: 100%;
            height: 500px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 10px;
        }

        .manipulatable-img {
            position: absolute;
            /* Initial centering, overridden by JS randomization */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            max-width: none; 
            cursor: move;
            user-select: none;
            touch-action: none; 
            
            /* Visual settings for overlapping */
            opacity: 0.6; 
            mix-blend-mode: screen; /* Helps visibility on dark backgrounds */
        }
        
        #code-img { z-index: 10; width: 300px; }
        #key-img { z-index: 5; width: 300px; }

        .controls-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }

        /* Fine-tuning layout */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .adjust-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0; 
        }

        .adjust-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .adjust-btn:active {
            background: #fda085;
            color: #000;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .section-title {
            color: #f6d365;
            font-family: 'Cinzel', serif;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 10: Intellectual Property</h1>
            <p class="instructions">Align the code with the key to unlock the answer.</p>
            
            <div id="img-manipulation-area">
                <img src="key.png" id="key-img" class="manipulatable-img" alt="Key Layer">
                <img src="code.png" id="code-img" class="manipulatable-img" alt="Code Layer">
            </div>

            <!-- CODE Controls (Top) -->
            <div class="controls-container">
                <div class="section-title">Code File Controls</div>
                
                <div class="control-group">
                    <label>Size</label>
                    <div class="slider-wrapper">
                        <button class="adjust-btn" onclick="adjustValue('size-code', -10)">&#60;</button>
                        <input type="range" id="size-code" min="50" max="600" step="10" value="300">
                        <button class="adjust-btn" onclick="adjustValue('size-code', 10)">&#62;</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Rotation</label>
                    <div class="slider-wrapper">
                        <button class="adjust-btn" onclick="adjustValue('rotate-code', -1)">&#60;</button>
                        <input type="range" id="rotate-code" min="0" max="360" step="1" value="0">
                        <button class="adjust-btn" onclick="adjustValue('rotate-code', 1)">&#62;</button>
                    </div>
                </div>
            </div>

            <!-- KEY Controls (Bottom) -->
            <div class="controls-container">
                <div class="section-title">Key File Controls</div>

                <div class="control-group">
                    <label>Size</label>
                    <div class="slider-wrapper">
                        <button class="adjust-btn" onclick="adjustValue('size-key', -10)">&#60;</button>
                        <input type="range" id="size-key" min="50" max="600" step="10" value="300">
                        <button class="adjust-btn" onclick="adjustValue('size-key', 10)">&#62;</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Rotation</label>
                    <div class="slider-wrapper">
                        <button class="adjust-btn" onclick="adjustValue('rotate-key', -1)">&#60;</button>
                        <input type="range" id="rotate-key" min="0" max="360" step="1" value="0">
                        <button class="adjust-btn" onclick="adjustValue('rotate-key', 1)">&#62;</button>
                    </div>
                </div>
            </div>

            <br><br>
            <input type="text" id="answerInput" class="answer-input" placeholder="Type the encoded message">
            <button class="btn-style" onclick="checkAnswer()">Unlock</button>
            <p id="error" class="error-msg">Incorrect.</p>

            <div id="ui-layer" class="ui-layer hidden-ui">
                <div class="game-msg">Access Granted</div>
                <button class="btn-style" onclick="proceed()">Next puzzle</button>
            </div>
        </div>

        <div class="spacer-large"></div>
        <div class="hidden-clue">10. property</div>
    </div>

    <script src="snow.js"></script>
    <script>
        // --- DRAG & DROP LOGIC ---
        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }

            // Touch support
            function dragTouchStart(e) {
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementTouchDrag(e) {
                e.preventDefault(); 
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }
        }

        const codeImg = document.getElementById("code-img");
        const keyImg = document.getElementById("key-img");
        
        makeDraggable(codeImg);
        makeDraggable(keyImg);

        // --- IMAGE MANIPULATION LOGIC ---
        
        // Random offsets for rotation so sliders don't reveal the solution
        let codeRotOffset = 0;
        let keyRotOffset = 0;

        function updateStyles() {
            // Code Image
            const szCode = document.getElementById('size-code').value;
            const rotCodeInput = parseFloat(document.getElementById('rotate-code').value);
            
            // Apply offset to rotation
            const finalRotCode = rotCodeInput + codeRotOffset;
            
            codeImg.style.width = szCode + "px";
            codeImg.style.transform = `rotate(${finalRotCode}deg)`;
            
            // Key Image
            const szKey = document.getElementById('size-key').value;
            const rotKeyInput = parseFloat(document.getElementById('rotate-key').value);
            
            // Apply offset to rotation
            const finalRotKey = rotKeyInput + keyRotOffset;

            keyImg.style.width = szKey + "px";
            keyImg.style.transform = `rotate(${finalRotKey}deg)`;
        }

        // Add event listeners to all inputs
        ['size-code', 'rotate-code', 'size-key', 'rotate-key'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateStyles);
        });

        // Fine tuning function
        window.adjustValue = function(id, delta) {
            const input = document.getElementById(id);
            let val = parseFloat(input.value);
            
            let newVal = val + delta;
            
            if(input.min) newVal = Math.max(parseFloat(input.min), newVal);
            if(input.max) newVal = Math.min(parseFloat(input.max), newVal);
            
            input.value = newVal;
            updateStyles();
        };

        // --- RANDOMIZATION LOGIC ---
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randomizeInit() {
            // Randomize Code Image
            const codeSize = getRandomInt(200, 450);
            
            // Generate random offsets for rotation solution
            codeRotOffset = getRandomInt(0, 360);
            keyRotOffset = getRandomInt(0, 360);

            // Also randomize the initial slider positions so it doesn't look static
            const initialSliderCode = getRandomInt(0, 360);
            const initialSliderKey = getRandomInt(0, 360);
            
            const codeTop = getRandomInt(30, 70); // Percentage
            const codeLeft = getRandomInt(30, 70); // Percentage

            document.getElementById('size-code').value = codeSize;
            document.getElementById('rotate-code').value = initialSliderCode;
            
            codeImg.style.top = codeTop + "%";
            codeImg.style.left = codeLeft + "%";
            
            // Randomize Key Image
            const keySize = getRandomInt(200, 450);
            const keyTop = getRandomInt(30, 70); // Percentage
            const keyLeft = getRandomInt(30, 70); // Percentage

            document.getElementById('size-key').value = keySize;
            document.getElementById('rotate-key').value = initialSliderKey;
            
            keyImg.style.top = keyTop + "%";
            keyImg.style.left = keyLeft + "%";

            // Apply these values
            updateStyles();
        }

        // Initialize on load
        randomizeInit();


        // --- GAME LOGIC ---
        const _a = [55, 48, 55, 55]; // 7077
        const _n = [49, 49, 45, 99, 97, 115, 101, 46, 104, 116, 109, 101, 108]; 

        function _decode(arr) { return String.fromCharCode(...arr); }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'win') {
                const now = audioCtx.currentTime; const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type = 'triangle'; o.frequency.value = freq; g.gain.setValueAtTime(0, now + i*0.1); g.gain.linearRampToValueAtTime(0.2, now + i*0.1 + 0.05); g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.5); o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5); });
            }
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput').value.trim();
            const correct = _decode(_a);
            
            if(input === correct) {
                playSound('win');
                const ui = document.getElementById('ui-layer');
                ui.classList.remove('hidden-ui');
                ui.classList.add('active-ui');
            } else {
                const err = document.getElementById('error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        function proceed() {
            window.location.href = _decode(_n);
        }

        document.getElementById("answerInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
