<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>10. property</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
    <style>
        /* --- IMAGE MANIPULATION STYLES --- */
        #img-manipulation-area {
            position: relative;
            width: 100%;
            height: 350px; 
            background: rgba(255, 255, 255, 0.9); /* Lighter background to help visibility in multiply mode */
            border: 2px solid rgba(255, 255, 255, 0.3); 
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 10px;
        }

        .manipulatable-img {
            position: absolute;
            top: 50%;
            left: 50%;
            max-width: none; 
            cursor: move;
            user-select: none;
            touch-action: none; 
            transform-origin: center center;
            box-sizing: border-box; 
        }
        
        /* Code Image (Background) */
        #code-img { 
            z-index: 5; 
            /* Width is fixed at 600px now */
            width: 600px; 
            transform: translate(-50%, -50%); 
            
            /* High visibility for the code itself */
            opacity: 1.0; 
            mix-blend-mode: normal; 

            /* Restore clipped corner */
            clip-path: polygon(
                10px 0, 
                100% 0, 
                100% 100%, 
                0 100%, 
                0 10px
            );
        }
        
        /* Key Image Container (Foreground/Draggable) */
        #key-img { 
            z-index: 10; 
            /* Initial width set by JS */
            width: 300px; 
            
            /* Multiply mode makes white pixels transparent */
            mix-blend-mode: multiply;
            opacity: 1.0; 

            /* BORDER CONFIGURATION */
            background-color: #222; /* The Border Color (Lighter Dark Grey) */
            padding: 5px;           /* The Border Width (Wider) */
            
            /* Outer Clip: Larger cut to contain the border */
            clip-path: polygon(
                15px 0, 
                100% 0, 
                100% 100%, 
                0 100%, 
                0 15px
            );
        }

        /* Inner image style */
        #key-img img {
            width: 100%;
            height: 100%;
            display: block;
            background-color: white; /* Necessary for multiply blend mode to work correctly on the content */
            
            /* Inner Clip: Smaller cut to create the inner edge of the border */
            clip-path: polygon(
                10px 0, 
                100% 0, 
                100% 100%, 
                0 100%, 
                0 10px
            );
        }

        .controls-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }

        /* Fine-tuning layout */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .adjust-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0; 
        }

        .adjust-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .adjust-btn:active {
            background: #fda085;
            color: #000;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .section-title {
            color: #f6d365;
            font-family: 'Cinzel', serif;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 10: Spirographic</h1>
            <p class="instructions">Restore alignment to recover the encoded message.</p>
            
            <div id="img-manipulation-area">
                <img src="code.png" id="code-img" class="manipulatable-img" style="top: 50%; left: 50%;" alt="Code Layer">
                
                <!-- Wrapper DIV for Border -->
                <div id="key-img" class="manipulatable-img">
                    <img src="key.png" alt="Key Layer">
                </div>
            </div>

            <!-- KEY Controls Only -->
            <div class="controls-container">
                <div class="control-group">
                    <label>Size</label>
                    <div class="slider-wrapper">
                        <button class="adjust-btn" onclick="adjustValue('size-key', -10)">&#60;</button>
                        <input type="range" id="size-key" min="50" max="600" step="10" value="300">
                        <button class="adjust-btn" onclick="adjustValue('size-key', 10)">&#62;</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Rotation</label>
                    <div class="slider-wrapper">
                        <button class="adjust-btn" onclick="adjustValue('rotate-key', -1)">&#60;</button>
                        <input type="range" id="rotate-key" min="0" max="360" step="1" value="0">
                        <button class="adjust-btn" onclick="adjustValue('rotate-key', 1)">&#62;</button>
                    </div>
                </div>
            </div>

            <br><br>
            <input type="text" id="answerInput" class="answer-input" placeholder="Type the encoded message">
            <button class="btn-style" onclick="checkAnswer()">Unlock</button>
            <p id="error" class="error-msg">Incorrect.</p>

            <div id="ui-layer" class="ui-layer hidden-ui">
                <div class="game-msg">Access Granted</div>
                <button class="btn-style" onclick="proceed()">Next puzzle</button>
            </div>
        </div>

        <div class="spacer-large"></div>
        <div class="hidden-clue">10. property</div>
    </div>

    <script src="snow.js"></script>
    <script>
        // --- DRAG & DROP LOGIC ---
        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }

            // Touch support
            function dragTouchStart(e) {
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementTouchDrag(e) {
                e.preventDefault(); 
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }
        }

        const codeImg = document.getElementById("code-img");
        const keyImg = document.getElementById("key-img");
        
        // Code image is static now, only Key is draggable
        makeDraggable(keyImg);

        // --- IMAGE MANIPULATION LOGIC ---
        
        let keyRotOffset = 0;

        function updateStyles() {
            // Key Image
            const szKey = document.getElementById('size-key').value;
            const rotKeyInput = parseFloat(document.getElementById('rotate-key').value);
            
            // Apply offset to rotation
            const finalRotKey = rotKeyInput + keyRotOffset;

            keyImg.style.width = szKey + "px";
            keyImg.style.transform = `rotate(${finalRotKey}deg)`;
        }

        // Add event listeners to remaining inputs
        ['size-key', 'rotate-key'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateStyles);
        });

        // Fine tuning function
        window.adjustValue = function(id, delta) {
            const input = document.getElementById(id);
            let val = parseFloat(input.value);
            
            let newVal = val + delta;
            
            if(input.min) newVal = Math.max(parseFloat(input.min), newVal);
            if(input.max) newVal = Math.min(parseFloat(input.max), newVal);
            
            input.value = newVal;
            updateStyles();
        };

        // --- RANDOMIZATION LOGIC ---
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randomizeInit() {
            // 1. Fixed CODE Image (Target) Size
            // Explicitly set to full size: 600px
            const codeTargetWidth = 600; 
            codeImg.style.width = codeTargetWidth + "px";

            // 2. Randomize Initial KEY Image (Visuals)
            // Pick a start size that is visibly different from target
            let keyStartSize;
            do {
                keyStartSize = getRandomInt(200, 500);
            } while (Math.abs(keyStartSize - codeTargetWidth) < 50);

            document.getElementById('size-key').value = keyStartSize;

            keyImg.style.top = getRandomInt(30, 60) + "%";
            keyImg.style.left = getRandomInt(30, 60) + "%";

            // 3. Randomize Rotation Solution
            // The Code file is fixed at 0 degrees.
            // User must rotate Key file to 0 degrees visual rotation to align.
            // Visual = Slider + Offset. 0 = TargetSlider + Offset -> Offset = -TargetSlider
            const targetSliderKey = getRandomInt(45, 315); // Random solution value on the slider
            keyRotOffset = -targetSliderKey;

            // 4. Scramble initial rotation slider
            document.getElementById('rotate-key').value = getRandomInt(0, 360);

            // Apply these values
            updateStyles();
        }

        // Initialize on load
        randomizeInit();


        // --- GAME LOGIC ---
        const _a = [55, 48, 55, 55]; // 7077
        const _n = [49, 49, 45, 99, 97, 115, 101, 46, 104, 116, 109, 101, 108]; 

        function _decode(arr) { return String.fromCharCode(...arr); }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'win') {
                const now = audioCtx.currentTime; const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type = 'triangle'; o.frequency.value = freq; g.gain.setValueAtTime(0, now + i*0.1); g.gain.linearRampToValueAtTime(0.2, now + i*0.1 + 0.05); g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.5); o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5); });
            }
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput').value.trim();
            const correct = _decode(_a);
            
            if(input === correct) {
                playSound('win');
                const ui = document.getElementById('ui-layer');
                ui.classList.remove('hidden-ui');
                ui.classList.add('active-ui');
            } else {
                const err = document.getElementById('error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        function proceed() {
            window.location.href = _decode(_n);
        }

        document.getElementById("answerInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
